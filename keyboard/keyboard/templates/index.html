<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальная Клавиатура</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        #screen-image {
            max-width: 90%;
            height: auto;
            border: 2px solid #333;
            border-radius: 10px;
        }
        .status {
            margin: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .healthy { background-color: #d4edda; color: #155724; }
        .unhealthy { background-color: #f8d7da; color: #721c24; }
    </style>
    <script>
        let errorCount = 0;
        const maxErrors = 5;
        
        function updateImage() {
            fetch('/image')
                .then(response => {
                    if (!response.ok) throw new Error('Network error');
                    return response.json();
                })
                .then(data => {
                    errorCount = 0; 
                    if (data.img_data) {
                        document.getElementById('screen-image').src = 'data:image/jpeg;base64,' + data.img_data;
                    }
                })
                .catch(error => {
                    console.error('Error fetching image:', error);
                    errorCount++;
                    if (errorCount >= maxErrors) {
                        document.getElementById('screen-image').style.display = 'none';
                        document.getElementById('error-message').style.display = 'block';
                    }
                    setTimeout(updateImage, 1000);
                });
        }

        function checkHealth() {
            fetch('/health')
                .then(response => response.json())
                .then(data => {
                    const statusDiv = document.getElementById('status');
                    statusDiv.className = 'status ' + data.status;
                    statusDiv.innerHTML = `Статус: ${data.status} | Камера: ${data.camera_available ? 'доступна' : 'недоступна'}`;
                });
        }

        setInterval(updateImage, 10);
        setInterval(checkHealth, 5000);

        window.onload = function() {
            updateImage();
            checkHealth();
        };
    </script>
</head>
<body>
    <h1>Virtual Keyboard with Hand Tracking</h1>
    
    
    <div class="github-link">
        <a href="https://github.com/gitmonstera" target="_blank">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" 
                 alt="GitHub" width="20" height="20">
            GitHub
        </a>
    </div>

    <div id="status" class="status">Проверка статуса...</div>
    <div id="error-message" style="display: none; color: red;">
        <h2>Ошибка подключения к камере</h2>
        <p>Проверьте, что камера доступна и не используется другим приложением</p>
    </div>
    <img id="screen-image" src="" alt="Virtual Keyboard Interface">
</body>
<style>
.github-link {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
}

.github-link a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background-color: #24292e;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    transition: all 0.3s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.github-link a:hover {
    background-color: #0366d6;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}
</style>
</html>
